backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ko"

# Everything lives in one file on purpose: each Publish is one commit and one
# Netlify deploy (15 credits), so the artist can edit every section and
# publish once instead of once per section.
collections:
  - name: "site"
    label: "포트폴리오 사이트"
    files:
      - file: "content/site.json"
        label: "사이트 전체 (모두 고친 뒤 게시 한 번)"
        name: "all"
        fields:
          - label: "카테고리 & 작품"
            name: "categories"
            widget: "list"
            minimize_collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (영문, 절대 중복/공백 금지)", name: "id", widget: "string" }
              - { label: "카테고리명 (한글)", name: "title", widget: "string" }
              - { label: "카테고리명 (영문)", name: "subtitle", widget: "string" }
              - label: "작품 목록"
                name: "works"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "작품명", name: "title", widget: "string" }
                  - { label: "소카테고리 (예: 무풍지대의 바람 (2017)) — 같은 이름을 쓴 작품들끼리 메뉴에서 묶입니다", name: "subcategory", widget: "string", required: false }
                  - { label: "메타정보 (재료 · 크기 · 연도)", name: "meta", widget: "string", required: false }
                  - label: "이미지"
                    name: "images"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { label: "이미지", name: "image", widget: "image" }
                      - { label: "이 사진의 짧은 설명 (사진 클릭하면 표시)", name: "caption", widget: "string", required: false }
                      - { label: "이 사진의 긴 설명 (사진 클릭하면 캡션 밑에 표시)", name: "note", widget: "text", required: false }
                  - label: "유튜브 영상 ID 목록"
                    name: "youtube"
                    widget: "list"
                    required: false
                    field: { label: "YouTube 영상 ID (URL 뒷부분, 예: 7KydUYZzJOE)", name: "id", widget: "string" }

          - label: "TEXT (비평글)"
            name: "articles"
            widget: "list"
            minimize_collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "저자", name: "author", widget: "string" }
              - label: "본문"
                name: "body"
                widget: "text"
                hint: "사진을 넣고 싶은 자리에 [사진1], [사진2] 처럼 적으세요. 번호는 아래 '본문 사진' 목록의 순서입니다. 번호를 안 적은 사진은 글 맨 끝에 붙습니다."
              - label: "본문 사진"
                name: "images"
                widget: "list"
                required: false
                summary: "{{fields.caption}} {{fields.image}}"
                fields:
                  - { label: "이미지", name: "image", widget: "image" }
                  - { label: "사진 설명 (선택 — 사진 아래 작게 표시)", name: "caption", widget: "string", required: false }
                  - label: "정렬"
                    name: "align"
                    widget: "select"
                    required: false
                    default: "center"
                    options:
                      - { label: "가운데", value: "center" }
                      - { label: "왼쪽", value: "left" }
                      - { label: "오른쪽", value: "right" }

          - { label: "CV — 이력 (자유 양식, 원하는 대로 줄바꿈해서 쓰세요)", name: "cv", widget: "text", required: false }

          - label: "CONTACT (연락처)"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "이메일", name: "email", widget: "string", required: false }
              - { label: "인스타그램 (@ 제외)", name: "instagram", widget: "string", required: false }
