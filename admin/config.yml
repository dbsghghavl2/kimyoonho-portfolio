backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ko"

collections:
  - name: "site"
    label: "포트폴리오 사이트"
    files:
      - file: "content/v2/site-data.json"
        label: "카테고리 & 작품"
        name: "sitedata"
        fields:
          - label: "카테고리 목록"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (영문, 절대 중복/공백 금지)", name: "id", widget: "string" }
              - { label: "카테고리명 (한글)", name: "title", widget: "string" }
              - { label: "카테고리명 (영문)", name: "subtitle", widget: "string" }
              - label: "작품 목록"
                name: "works"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "작품명", name: "title", widget: "string" }
                  - { label: "소카테고리 (예: 무풍지대의 바람 (2017)) — 같은 이름을 쓴 작품들끼리 메뉴에서 묶입니다", name: "subcategory", widget: "string", required: false }
                  - { label: "메타정보 (재료 · 크기 · 연도)", name: "meta", widget: "string", required: false }
                  - label: "이미지"
                    name: "images"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { label: "이미지", name: "image", widget: "image" }
                      - { label: "이 사진의 짧은 설명 (사진 클릭하면 표시)", name: "caption", widget: "string", required: false }
                      - { label: "이 사진의 긴 설명 (사진 클릭하면 캡션 밑에 표시)", name: "note", widget: "text", required: false }
                  - label: "유튜브 영상 ID 목록"
                    name: "youtube"
                    widget: "list"
                    required: false
                    field: { label: "YouTube 영상 ID (URL 뒷부분, 예: 7KydUYZzJOE)", name: "id", widget: "string" }

      - file: "content/v2/text-data.json"
        label: "TEXT (비평글)"
        name: "textdata"
        fields:
          - label: "글 목록"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "저자", name: "author", widget: "string" }
              - { label: "본문", name: "body", widget: "text" }

      - file: "content/v2/cv-data.json"
        label: "CV"
        name: "cvdata"
        fields:
          - { label: "이력 (자유 양식 — 원하는 대로 줄바꿈해서 쓰세요)", name: "text", widget: "text", required: false }

      - file: "content/v2/contact-data.json"
        label: "CONTACT (연락처)"
        name: "contactdata"
        fields:
          - { label: "이메일", name: "email", widget: "string", required: false }
          - { label: "인스타그램 (@ 제외)", name: "instagram", widget: "string", required: false }
