<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 | 김윤호</title>
<style>
  /* Decap's default image widget/media-library previews render photos at
     close to natural size, which is huge for our full-resolution source
     images. Cap every image inside the CMS app (#nc-root) to a sane box. */
  #nc-root img{
    max-height: 220px !important;
    max-width: 100% !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain;
  }
</style>
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // The right-hand "미리보기" panel renders inside its own iframe, so the
  // <style> above (scoped to #nc-root) never reaches it. registerPreviewStyle
  // injects CSS into that iframe's document instead.
  if (window.CMS && window.CMS.registerPreviewStyle) {
    window.CMS.registerPreviewStyle(`
      img {
        max-height: 260px !important;
        max-width: 100% !important;
        width: auto !important;
        height: auto !important;
        object-fit: contain;
        display: block;
        margin-bottom: 8px;
      }
    `, { raw: true });
  }
</script>
</body>
</html>
