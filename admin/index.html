<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 | 김윤호</title>
<style>
  /* Decap's default image widget/media-library previews render photos at
     close to natural size, which is huge for our full-resolution source
     images. Cap every image inside the CMS app (#nc-root) to a sane box. */
  #nc-root img{
    max-height: 220px !important;
    max-width: 100% !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain;
  }
</style>
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  // The right-hand "미리보기" panel renders inside its own iframe, so the
  // <style> in <head> (scoped to #nc-root) never reaches it. registerPreviewStyle
  // injects CSS into that iframe's document instead. Kept as a general safety
  // cap on top of the inline styles the templates below already set.
  if (window.CMS && window.CMS.registerPreviewStyle) {
    window.CMS.registerPreviewStyle(`
      body { font-family: -apple-system, 'Malgun Gothic', sans-serif; }
      img { max-height: 260px !important; object-fit: contain; }
    `, { raw: true });
  }

  // Custom preview template: renders the single "사이트 전체" entry close
  // to how each section looks on the live site (thumbnails + captions, not a
  // raw "field: value" dump), re-rendering on every keystroke.
  if (window.CMS && window.createClass && window.h) {

    var sectionTitle = function (text) {
      return h('div', { style: { fontSize: '12px', fontWeight: 700, color: '#1a63d8', letterSpacing: '0.08em', borderBottom: '1px solid #ddd', padding: '0 0 6px', margin: '0 0 20px' } }, text);
    };

    var renderCategories = function (categories, getAsset) {
      return categories.map(function (cat, ci) {
        var works = cat.get('works') || [];
        return h('div', { key: ci, style: { marginBottom: '48px' } },
          h('h1', { style: { fontSize: '20px', fontWeight: 700, margin: '0 0 2px' } }, cat.get('title')),
          h('div', { style: { fontSize: '13px', fontWeight: 700, color: '#999', marginBottom: '20px' } }, cat.get('subtitle')),
          works.map(function (w, wi) {
            var images = w.get('images') || [];
            return h('div', { key: wi, style: { marginBottom: '28px', paddingBottom: '20px', borderBottom: '1px solid #eee' } },
              w.get('subcategory') ? h('div', { style: { fontSize: '12px', color: '#1a63d8', marginBottom: '3px' } }, w.get('subcategory')) : null,
              h('div', { style: { fontSize: '15px', fontWeight: 700, marginBottom: '3px' } }, w.get('title')),
              h('div', { style: { fontSize: '12px', color: '#777', marginBottom: '10px' } }, w.get('meta')),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
                images.map(function (img, ii) {
                  var src = img.get('image');
                  return h('div', { key: ii, style: { width: '110px' } },
                    h('img', {
                      src: src ? getAsset(src).toString() : '',
                      loading: 'lazy',
                      style: { width: '100%', height: '90px', objectFit: 'cover', background: '#f0f0f0', display: 'block' }
                    }),
                    img.get('caption')
                      ? h('div', { style: { fontSize: '10px', fontStyle: 'italic', color: '#999', marginTop: '3px' } }, img.get('caption'))
                      : null
                  );
                })
              )
            );
          })
        );
      });
    };

    // mirrors articleBodyHtml() in the site's index.html: "[사진N]" in the
    // body places image N there, unreferenced images go after the text
    var IMG_MARGIN = { left: '0 auto 0 0', right: '0 0 0 auto', center: '0 auto' };
    var renderArticles = function (articles, getAsset) {
      return articles.map(function (a, i) {
        var imgs = a.get('images') ? a.get('images').toArray() : [];
        var used = {};
        function fig(n, key) {
          var im = imgs[n];
          if (!im || !im.get('image')) return null;
          used[n] = true;
          var align = IMG_MARGIN[im.get('align')] ? im.get('align') : 'center';
          return h('figure', { key: key, style: { margin: '20px 0', textAlign: align } },
            h('img', { src: getAsset(im.get('image')).toString(), style: { maxWidth: '100%', display: 'block', margin: IMG_MARGIN[align] } }),
            im.get('caption')
              ? h('figcaption', { style: { fontSize: '11px', color: '#999', marginTop: '6px' } }, im.get('caption'))
              : null
          );
        }
        var body = String(a.get('body') || '').split(/\[사진\s*(\d+)\]/).map(function (part, pi) {
          if (pi % 2) return fig(parseInt(part, 10) - 1, 'f' + pi);
          var text = part.replace(/^\n+|\n+$/g, '');
          return text
            ? h('div', { key: 't' + pi, style: { fontSize: '13px', lineHeight: '1.9', color: '#333', whiteSpace: 'pre-line' } }, text)
            : null;
        });
        var rest = imgs.map(function (_, n) { return used[n] ? null : fig(n, 'r' + n); });
        return h('div', { key: i, style: { marginBottom: '40px', maxWidth: '640px' } },
          h('div', { style: { fontSize: '16px', fontWeight: 500, marginBottom: '4px' } }, a.get('title')),
          h('div', { style: { fontSize: '14px', fontWeight: 500, color: '#000', textAlign: 'right', marginBottom: '14px' } }, a.get('author')),
          body,
          rest
        );
      });
    };

    var AllPreview = createClass({
      render: function () {
        var getAsset = this.props.getAsset;
        var data = this.props.entry.get('data');
        var contact = data.get('contact');
        return h('div', { style: { padding: '20px', maxWidth: '900px' } },
          sectionTitle('카테고리 & 작품'),
          renderCategories(data.get('categories') || [], getAsset),
          sectionTitle('TEXT (비평글)'),
          renderArticles(data.get('articles') || [], getAsset),
          sectionTitle('CV'),
          h('div', { style: { maxWidth: '640px', fontSize: '14px', lineHeight: '2', color: '#333', whiteSpace: 'pre-line', marginBottom: '48px' } }, data.get('cv') || ''),
          sectionTitle('CONTACT'),
          h('div', { style: { fontSize: '14px', lineHeight: '2' } },
            h('div', {}, 'Email: ' + ((contact && contact.get('email')) || '(비어있음)')),
            h('div', {}, 'Instagram: ' + ((contact && contact.get('instagram')) || '(비어있음)'))
          )
        );
      }
    });
    CMS.registerPreviewTemplate('all', AllPreview);
  }
</script>
</body>
</html>
