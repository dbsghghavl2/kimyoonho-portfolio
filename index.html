<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김윤호 | Kim Younho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* palette + metrics measured from erwinwurm.com/artworks/sculptures */
    --gray-text:#999999;
    --gray-light:#999999;
    --black:#000000;
    --bg:#ffffff;
    --sidebar-w:300px;   /* reference content column starts at x=300 */
    --edge-x:20px;       /* reference left/top page edge */
    --edge-y:22px;
    --gap:28px;
    --thumb-h:125px;   /* reference uses fixed-height, aspect-preserved thumbs */
    --thumb-gap:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto','Noto Sans KR',sans-serif;
    color:var(--black);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- Sidebar ----------
     Reference puts its brand at x=20,y=22 and starts the content column at
     x=300, so the sidebar edge padding matches those numbers exactly. */
  #sidebar{
    position:fixed;
    top:0;left:0;bottom:0;
    width:var(--sidebar-w);
    padding:var(--edge-y) 16px var(--edge-y) var(--edge-x);
    overflow-y:auto;
    background:var(--bg);
    z-index:20;
  }
  #sidebar::-webkit-scrollbar{width:0;}
  .brand{
    font-size:21px;
    line-height:25px;
    font-weight:700;
    letter-spacing:0.02em;
    margin-bottom:0;
  }
  .brand-en{
    font-size:11px;
    line-height:14px;
    color:var(--gray-light);
    letter-spacing:0.06em;
    margin-bottom:16px;
    display:block;
  }
  /* Reference top-level menu is 21px/24px, but that ratio is tuned for
     all-caps Latin, whose glyphs leave slack at the top and bottom of the
     em box. Korean glyphs fill it, so the same ratio reads cramped --
     these line-heights are raised to match the reference's *visual*
     whitespace between rows rather than its raw numbers. */
  nav.mainnav{display:flex;flex-direction:column;}
  nav.mainnav a{
    font-size:20px;
    line-height:27px;
    color:var(--gray-text);
    padding:0;
    font-weight:700;
    letter-spacing:0.01em;
    transition:color .15s ease;
  }
  nav.mainnav a:hover{color:var(--black);}
  nav.mainnav a.active{color:var(--black);font-weight:700;}

  /* ---------- Sidebar accordion (sub-categories) ---------- */
  .nav-item{display:flex;flex-direction:column;}
  .subnav{
    max-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    margin:0 0 0 10px;
    padding-left:12px;
    border-left:1px solid #e5e5e5;
    transition:max-height .3s ease;
  }
  .nav-item.open .subnav{max-height:400px;margin-bottom:4px;}
  /* reference second-level menu: 15px/700, line-height 19px.
     Specificity must beat `nav.mainnav a`, which these links sit inside. */
  nav.mainnav .subnav-link{
    font-size:15px;
    line-height:21px;
    color:var(--gray-light);
    font-weight:700;
    padding:0;
    letter-spacing:0.01em;
    transition:color .15s ease;
  }
  nav.mainnav .subnav-link:hover{color:var(--black);}
  nav.mainnav .subnav-link.active{color:var(--black);font-weight:700;}

  .category-block{margin-top:26px;}
  .category-block .cat-title{
    font-size:13px;
    color:var(--gray-text);
    padding:7px 0;
    cursor:pointer;
    transition:color .15s ease;
  }
  .category-block .cat-title:hover,
  .category-block .cat-title.active{color:var(--black);font-weight:500;}
  .category-block .subtitle-en{
    font-size:10px;
    color:var(--gray-light);
    display:block;
    margin-top:-4px;
    margin-bottom:2px;
    font-weight:300;
  }

  /* ---------- Hamburger (mobile) ---------- */
  #hamburger{
    display:none;
    position:fixed;
    top:18px;left:20px;
    z-index:30;
    width:36px;height:36px;
    background:transparent;
    border:none;
    cursor:pointer;
    padding:0;
  }
  #hamburger span{
    display:block;
    width:22px;height:1.5px;
    background:var(--black);
    margin:6px auto;
    transition:.2s;
  }
  #hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
  #hamburger.open span:nth-child(2){opacity:0;}
  #hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}

  /* ---------- Main ---------- */
  #main{
    margin-left:var(--sidebar-w);
    min-height:100vh;
    /* content column begins flush at x = sidebar width, top-aligned with the
       brand, exactly as on the reference */
    padding:var(--edge-y) var(--edge-x) 120px 0;
  }
  .page{display:none;}
  .page.active{display:block;}

  /* Home */
  .home-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    max-width:920px;
    /* top-align with the first sidebar menu item ("시스템과 자유"), not the
       brand/logo above it -- brand(25px) + brand-en(14px+16px margin) = 55px */
    margin-top:55px;
  }
  .home-grid .home-cat{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    cursor:pointer;
    background:#f2f2f2;
  }
  .home-grid .home-cat img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .5s ease;
  }
  .home-grid .home-cat:hover img{transform:scale(1.05);}
  .home-grid .home-cat .label{
    position:absolute;left:0;right:0;bottom:0;
    padding:14px 16px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    color:#fff;
    font-size:13px;
    letter-spacing:0.02em;
  }
  .home-grid .home-cat .label .en{
    display:block;
    font-size:9px;
    color:rgba(255,255,255,.75);
    margin-top:2px;
    letter-spacing:0.06em;
  }

  /* Category page header */
  .cat-header{margin-bottom:30px;max-width:640px;}
  .cat-header h1{
    font-size:21px;
    line-height:25px;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
  }
  .cat-header .en{
    font-size:15px;
    line-height:19px;
    font-weight:700;
    color:var(--gray-text);
    letter-spacing:0.01em;
  }

  /* Work block */
  .work{
    max-width:920px;
    margin-bottom:88px;
    padding-bottom:88px;
  }
  .work:last-child{
    border-bottom:none;
    margin-bottom:0;
  }
  .work-title{
    font-size:17px;
    font-weight:500;
    margin:0 0 14px 0;
  }
  .work-variant + .work-variant{
    margin-top:40px;
  }
  .work-caption{
    margin-top:18px;
  }
  .work-meta{
    font-size:12px;
    color:var(--gray-text);
    line-height:1.6;
  }
  .work-desc{
    font-size:13px;
    line-height:1.9;
    color:var(--gray-text);
    white-space:pre-line;
    max-width:620px;
    margin-top:10px;
  }
  .work-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:6px;
  }
  .work-gallery img{
    width:100%;
    height:230px;
    object-fit:cover;
    cursor:zoom-in;
    background:#f2f2f2;
    transition:opacity .2s ease;
  }
  .work-gallery img:hover{opacity:0.85;}
  .work-gallery.single{grid-template-columns:minmax(260px,560px);}
  .work-gallery.single img{height:auto;max-height:640px;object-fit:contain;background:none;}

  /* Sub-category block (grouped thumbnail archive, erwinwurm.com-style) */
  .subcat{
    max-width:1100px;
    margin-bottom:55px;
  }
  .subcat-title{
    font-size:15px;
    line-height:19px;
    font-weight:700;
    margin:0 0 10px 0;
    color:var(--black);
  }
  .subcat-title .subcat-year{
    font-weight:700;
    color:var(--gray-text);
  }
  /* fixed height + auto width keeps every thumbnail's true aspect ratio
     (the reference site never crops); they flow and wrap in rows */
  .thumb-grid{
    display:flex;
    flex-wrap:wrap;
    gap:var(--thumb-gap);
    margin-bottom:0;
  }
  .thumb-grid img{
    height:var(--thumb-h);
    width:auto;
    max-width:100%;
    object-fit:contain;
    cursor:pointer;
    background:#f2f2f2;
    transition:opacity .2s ease;
  }
  .thumb-grid img:hover{opacity:0.8;}

  .video-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
    margin-bottom:26px;
  }
  .video-wrap .yt{
    position:relative;
    padding-top:56.25%;
    background:#111;
  }
  .video-wrap .yt iframe{
    position:absolute;top:0;left:0;width:100%;height:100%;border:0;
  }

  /* Lightbox */
  #lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(255,255,255,.97);
    z-index:100;
    align-items:center;
    justify-content:flex-start;
    flex-direction:column;
    overflow-y:auto;          /* notes can run long -- let the panel scroll */
    padding:56px 0 48px;
  }
  #lightbox.open{display:flex;}
  #lightbox img{
    max-width:88vw;
    max-height:70vh;
    object-fit:contain;
    flex-shrink:0;
  }
  #lightbox .lb-close{
    position:absolute;top:24px;right:32px;
    font-size:28px;
    font-weight:300;
    color:var(--gray-text);
    cursor:pointer;
    background:none;border:none;
    z-index:20;
  }
  #lightbox .lb-close:hover{color:var(--black);}
  #lightbox .lb-nav{
    position:fixed;top:0;bottom:0;
    width:12%;
    display:flex;align-items:center;
    background:transparent;border:none;
    cursor:pointer;
    font-size:26px;
    color:var(--gray-light);
    z-index:10;
  }
  #lightbox .lb-nav:hover{color:var(--black);}
  #lightbox .lb-prev{left:0;justify-content:flex-start;padding-left:18px;}
  #lightbox .lb-next{right:0;justify-content:flex-end;padding-right:18px;}
  #lightbox .lb-count{
    font-size:13px;line-height:19px;color:var(--gray-text);
    margin-top:12px;
    max-width:640px;width:100%;padding:0 24px;
    text-align:left;
  }
  #lightbox .lb-caption{
    margin-top:10px;
    text-align:left;
    max-width:640px;
    width:100%;
    padding:0 24px;
    font-size:13px;
    line-height:19px;
  }
  #lightbox .lb-caption .lb-title{
    font-size:13px;
    line-height:19px;
    font-weight:400;
    font-style:italic;
    color:var(--black);
  }
  #lightbox .lb-caption .lb-meta{
    font-size:13px;
    line-height:19px;
    color:var(--black);
  }
  #lightbox .lb-caption .lb-photo-caption{
    font-size:13px;
    line-height:19px;
    color:var(--gray-text);
  }
  /* long-form text from the slide this photo came from */
  #lightbox .lb-caption .lb-note{
    font-size:13px;
    line-height:19px;
    color:var(--black);
    white-space:pre-line;
    margin-top:12px;
  }
  #lightbox .lb-caption .lb-note svg{max-width:100%;height:auto;}

  /* nav divider (whitespace only, no line — per design system) */
  .nav-divider{ height:22px; }

  /* empty state */
  .empty-note{
    font-size:13px;
    color:var(--gray-light);
    letter-spacing:0.02em;
  }

  /* CV: free-form text, same treatment as the TEXT page body */
  .cv-text{
    max-width:640px;
    font-size:14px;
    line-height:2;
    white-space:pre-line;
    color:#333;
  }

  /* TEXT (비평글) */
  .text-article{
    max-width:640px;
    margin-bottom:64px;
  }
  .text-title{ font-size:18px; font-weight:500; margin:0 0 6px 0; }
  .text-author{ font-size:12px; color:var(--gray-text); margin-bottom:20px; }
  .text-body{ font-size:14px; line-height:2; white-space:pre-line; color:#333; }

  /* CONTACT */
  .contact-list{ max-width:480px; }
  .contact-row{
    display:flex;
    gap:20px;
    padding:10px 0;
    font-size:14px;
  }
  .contact-row a{ color:var(--black); }
  .contact-row a:hover{ color:var(--gray-text); }
  .contact-label{
    flex:0 0 90px;
    color:var(--gray-text);
    font-size:12px;
    letter-spacing:0.06em;
    padding-top:2px;
  }

  /* Footer */
  .site-footer{
    margin-top:100px;
    font-size:11px;
    color:var(--gray-light);
  }

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    :root{--sidebar-w:250px;}
    .home-grid{grid-template-columns:1fr 1fr;}
  }

  @media (max-width:680px){
    #hamburger{display:block;}
    #sidebar{
      transform:translateX(-100%);
      transition:transform .25s ease;
      width:76vw;
      max-width:300px;
      box-shadow:0 0 0 rgba(0,0,0,0);
      padding-top:80px;
    }
    #sidebar.open{
      transform:translateX(0);
      box-shadow:2px 0 24px rgba(0,0,0,.08);
    }
    #main{margin-left:0;padding:66px var(--edge-x) 80px var(--edge-x);}
    .home-grid{grid-template-columns:1fr 1fr;}
    .work-gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .work-gallery img{height:170px;}
    :root{--thumb-h:95px;--thumb-gap:8px;}
  }
</style>
</head>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

<button id="hamburger" aria-label="메뉴">
  <span></span><span></span><span></span>
</button>

<aside id="sidebar">
  <a href="#" data-page="home" class="brand-link">
    <span class="brand">김윤호</span>
    <span class="brand-en">KIM YOUNHO</span>
  </a>
  <nav class="mainnav" id="mainnav"></nav>
</aside>

<main id="main">
  <section class="page active" id="page-home">
    <div class="home-grid" id="homeGrid"></div>
  </section>

  <!-- category pages injected by JS -->
  <div id="categoryPages"></div>
</main>

<div id="lightbox">
  <button class="lb-close" aria-label="닫기">&times;</button>
  <button class="lb-nav lb-prev" aria-label="이전">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" aria-label="다음">&#8250;</button>
  <div class="lb-caption">
    <div class="lb-title" id="lb-title"></div>
    <div class="lb-meta" id="lb-meta"></div>
    <div class="lb-photo-caption" id="lb-photo-caption"></div>
    <div class="lb-note" id="lb-note"></div>
  </div>
  <div class="lb-count" id="lb-count"></div>
</div>

<script>
let SITE_DATA = [];
let CV_DATA = "";
let TEXT_DATA = [];
let CONTACT_DATA = { email: "", instagram: "" };

async function loadJSON(path, fallback){
  try {
    // Netlify's edge CDN was observed caching these files for ~1 year and
    // serving stale copies (a deleted admin photo kept showing) even with a
    // Cache-Control: no-cache response header. A per-load query string makes
    // every request a distinct URL, which no CDN or browser cache can treat
    // as a hit -- so admin saves always show up immediately.
    const bustedPath = path + (path.includes("?") ? "&" : "?") + "v=" + Date.now();
    const res = await fetch(bustedPath, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (e) {
    console.error("failed to load", path, e);
    return fallback;
  }
}

window.SITE_DATA_READY = (async function(){
  const [siteRes, cvRes, textRes, contactRes] = await Promise.all([
    loadJSON("content/v2/site-data.json", { categories: [] }),
    loadJSON("content/v2/cv-data.json", { text: "" }),
    loadJSON("content/v2/text-data.json", { articles: [] }),
    loadJSON("content/v2/contact-data.json", { email: "", instagram: "" })
  ]);
  SITE_DATA = siteRes.categories || [];
  CV_DATA = cvRes.text || "";
  TEXT_DATA = textRes.articles || [];
  CONTACT_DATA = contactRes || { email: "", instagram: "" };
})();
</script>
<script>
(async function(){
  await window.SITE_DATA_READY;
  // must match --thumb-h in the stylesheet
  const THUMB_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--thumb-h'), 10) || 125;
  function escapeAttr(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  const nav = document.getElementById('mainnav');
  const homeGrid = document.getElementById('homeGrid');
  const catPagesWrap = document.getElementById('categoryPages');
  const pages = {}; // id -> element

  // build nav + home grid + category pages
  SITE_DATA.forEach((cat, ci) => {
    // nav item (main link + optional accordion sub-nav)
    const navItem = document.createElement('div');
    navItem.className = 'nav-item';

    const link = document.createElement('a');
    link.href = '#';
    link.dataset.page = cat.id;
    link.innerHTML = cat.title;
    navItem.appendChild(link);

    // sub-categories, in first-appearance order
    const subLabels = [];
    cat.works.forEach(w => {
      if (w.subcategory && !subLabels.includes(w.subcategory)) subLabels.push(w.subcategory);
    });
    if (subLabels.length){
      navItem.classList.add('has-subnav');
      const subnav = document.createElement('div');
      subnav.className = 'subnav';
      subLabels.forEach((label, si) => {
        const subLink = document.createElement('a');
        subLink.href = '#';
        subLink.className = 'subnav-link';
        subLink.dataset.cat = cat.id;
        subLink.dataset.subtarget = `subcat-${cat.id}-${si}`;
        subLink.textContent = label;
        subnav.appendChild(subLink);
      });
      navItem.appendChild(subnav);
    }
    nav.appendChild(navItem);

    // home grid tile
    const tile = document.createElement('div');
    tile.className = 'home-cat';
    tile.dataset.page = cat.id;
    const coverImg = cat.works.find(w => w.images && w.images.length)?.images[0]?.image;
    tile.innerHTML = `
      <img src="${coverImg}" alt="${cat.title}" loading="lazy">
      <div class="label">${cat.title}<span class="en">${cat.subtitle}</span></div>
    `;
    homeGrid.appendChild(tile);

    // category page: works grouped into sub-category thumbnail grids
    // (falls back to one ungrouped grid when a category has no sub-categories)
    const page = document.createElement('section');
    page.className = 'page';
    page.id = 'page-' + cat.id;

    const buckets = []; // [{ key, items: [work,...] }]
    const bucketIndex = {};
    cat.works.forEach(w => {
      const key = w.subcategory || '';
      if (!(key in bucketIndex)) {
        bucketIndex[key] = buckets.length;
        buckets.push({ key, items: [] });
      }
      buckets[bucketIndex[key]].items.push(w);
    });

    let subcatHtml = '';
    buckets.forEach((bucket, si) => {
      const galleryId = `${cat.id}-${si}`;
      let imgN = 0;
      const thumbsHtml = bucket.items.map(w => {
        const titleAttr = escapeAttr(w.title || '');
        const metaAttr = escapeAttr(w.meta || '');
        return w.images.map(img => {
          const captionAttr = escapeAttr(img.caption || '');
          const noteAttr = escapeAttr(img.note || '');
          const idx = imgN++;
          // Thumbs render at a fixed height with auto width. A lazy <img> with
          // no intrinsic size would collapse to 0 width and never load, so emit
          // width/height whenever the build recorded them; otherwise load eagerly
          // and let the image size itself.
          let sizeAttrs = 'loading="lazy"';
          if (img.w && img.h){
            sizeAttrs = `width="${Math.max(1, Math.round(THUMB_H * img.w / img.h))}" height="${THUMB_H}" loading="lazy"`;
          }
          return `<img src="${img.image}" alt="${w.title}" ${sizeAttrs} data-gallery="${galleryId}" data-idx="${idx}" data-title="${titleAttr}" data-meta="${metaAttr}" data-photo-caption="${captionAttr}" data-note="${noteAttr}">`;
        }).join('');
      }).join('');

      let videoHtml = '';
      bucket.items.forEach(w => {
        if (w.youtube && w.youtube.length){
          videoHtml += w.youtube.map(id =>
            `<div class="yt"><iframe src="https://www.youtube.com/embed/${id}" title="${w.title}" allowfullscreen loading="lazy"></iframe></div>`
          ).join('');
        }
      });
      if (videoHtml) videoHtml = `<div class="video-wrap">${videoHtml}</div>`;

      // all prose lives in the lightbox now (per photo), so the page itself
      // is a pure thumbnail archive like the reference site
      const yearMatch = bucket.key.match(/^(.*?)\s*(\(\d{4}\))\s*$/);
      const headerLabel = yearMatch
        ? `${yearMatch[1]} <span class="subcat-year">${yearMatch[2]}</span>`
        : bucket.key;
      const headerHtml = bucket.key ? `<h2 class="subcat-title">${headerLabel}</h2>` : '';

      subcatHtml += `
        <div class="subcat" id="subcat-${cat.id}-${si}">
          ${headerHtml}
          ${videoHtml}
          <div class="thumb-grid" data-gallery="${galleryId}">${thumbsHtml}</div>
        </div>`;
    });

    page.innerHTML = `
      <div class="cat-header">
        <h1>${cat.title}</h1>
        <div class="en">${cat.subtitle}</div>
      </div>
      ${subcatHtml}
      <div class="site-footer">김윤호 KIM YOUNHO</div>
    `;
    catPagesWrap.appendChild(page);
    pages[cat.id] = page;
  });
  pages['home'] = document.getElementById('page-home');

  // ---- nav divider ----
  const navDivider = document.createElement('div');
  navDivider.className = 'nav-divider';
  nav.appendChild(navDivider);

  // ---- CV page ----
  {
    const link = document.createElement('a');
    link.href = '#'; link.dataset.page = 'cv'; link.innerHTML = 'CV';
    nav.appendChild(link);

    const cvText = (CV_DATA || '').trim();
    const bodyHtml = cvText
      ? `<div class="cv-text">${cvText}</div>`
      : `<div class="empty-note">공란</div>`;
    const page = document.createElement('section');
    page.className = 'page';
    page.id = 'page-cv';
    page.innerHTML = `
      <div class="cat-header"><h1>CV</h1></div>
      ${bodyHtml}
      <div class="site-footer">김윤호 KIM YOUNHO</div>
    `;
    catPagesWrap.appendChild(page);
    pages['cv'] = page;
  }

  // ---- TEXT page (비평글: 제목, 저자, 본문) ----
  {
    const link = document.createElement('a');
    link.href = '#'; link.dataset.page = 'text'; link.innerHTML = 'TEXT';
    nav.appendChild(link);

    let bodyHtml;
    if (!TEXT_DATA.length){
      bodyHtml = `<div class="empty-note">공란</div>`;
    } else {
      bodyHtml = TEXT_DATA.map(t => `
        <div class="text-article">
          <h2 class="text-title">${t.title || ''}</h2>
          <div class="text-author">${t.author || ''}</div>
          <div class="text-body">${t.body || ''}</div>
        </div>`).join('');
    }
    const page = document.createElement('section');
    page.className = 'page';
    page.id = 'page-text';
    page.innerHTML = `
      <div class="cat-header"><h1>TEXT</h1></div>
      ${bodyHtml}
      <div class="site-footer">김윤호 KIM YOUNHO</div>
    `;
    catPagesWrap.appendChild(page);
    pages['text'] = page;
  }

  // ---- CONTACT page (이메일, 인스타그램) ----
  {
    const link = document.createElement('a');
    link.href = '#'; link.dataset.page = 'contact'; link.innerHTML = 'CONTACT';
    nav.appendChild(link);

    let bodyHtml;
    if (!CONTACT_DATA.email && !CONTACT_DATA.instagram){
      bodyHtml = `<div class="empty-note">공란</div>`;
    } else {
      bodyHtml = `<div class="contact-list">
        ${CONTACT_DATA.email ? `<div class="contact-row"><span class="contact-label">Email</span><a href="mailto:${CONTACT_DATA.email}">${CONTACT_DATA.email}</a></div>` : ''}
        ${CONTACT_DATA.instagram ? `<div class="contact-row"><span class="contact-label">Instagram</span><a href="https://instagram.com/${CONTACT_DATA.instagram.replace('@','')}" target="_blank" rel="noopener">@${CONTACT_DATA.instagram.replace('@','')}</a></div>` : ''}
      </div>`;
    }
    const page = document.createElement('section');
    page.className = 'page';
    page.id = 'page-contact';
    page.innerHTML = `
      <div class="cat-header"><h1>CONTACT</h1></div>
      ${bodyHtml}
      <div class="site-footer">김윤호 KIM YOUNHO</div>
    `;
    catPagesWrap.appendChild(page);
    pages['contact'] = page;
  }

  // ---- mobile sidebar (declared first: showPage() below calls closeSidebar()) ----
  const hamburger = document.getElementById('hamburger');
  const sidebar = document.getElementById('sidebar');
  function closeSidebar(){
    hamburger.classList.remove('open');
    sidebar.classList.remove('open');
  }
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    sidebar.classList.toggle('open');
  });

  // ---- navigation ----
  function showPage(id, opts){
    opts = opts || {};
    Object.values(pages).forEach(p => p.classList.remove('active'));
    (pages[id] || pages['home']).classList.add('active');
    document.querySelectorAll('.mainnav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === id);
    });
    document.querySelectorAll('.nav-item').forEach(item => {
      const mainLink = item.querySelector(':scope > a');
      item.classList.toggle('open', !!mainLink && mainLink.dataset.page === id);
    });
    if (!opts.keepScroll) window.scrollTo(0,0);
    closeSidebar();
    if (location.hash !== '#'+id) history.replaceState(null,'','#'+id);
  }

  document.addEventListener('click', (e) => {
    const subLink = e.target.closest('.subnav-link');
    if (subLink){
      e.preventDefault();
      showPage(subLink.dataset.cat, { keepScroll: true });
      document.querySelectorAll('.subnav-link').forEach(a => a.classList.toggle('active', a === subLink));
      const target = document.getElementById(subLink.dataset.subtarget);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    const target = e.target.closest('[data-page]');
    if (target){
      e.preventDefault();
      showPage(target.dataset.page);
    }
  });

  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#','') || 'home';
    showPage(id);
  });

  // initial page from hash
  const initId = location.hash.replace('#','') || 'home';
  showPage(initId);

  // ---- lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-count');
  const lbTitle = document.getElementById('lb-title');
  const lbMeta = document.getElementById('lb-meta');
  const lbPhotoCaption = document.getElementById('lb-photo-caption');
  const lbNote = document.getElementById('lb-note');
  let currentGallery = [];
  let currentCaptions = [];
  let currentNotes = [];
  let currentTitles = [];
  let currentMetas = [];
  let currentIdx = 0;

  function openLightbox(galleryId, idx){
    // a gallery is now a whole sub-category grid and can span several works,
    // so title/meta/caption/note are tracked per-image, not once for the gallery
    const imgs = Array.from(document.querySelectorAll(`img[data-gallery="${galleryId}"]`));
    currentGallery = imgs.map(img => img.src);
    currentCaptions = imgs.map(img => img.dataset.photoCaption || '');
    currentNotes = imgs.map(img => img.dataset.note || '');
    currentTitles = imgs.map(img => img.dataset.title || '');
    currentMetas = imgs.map(img => img.dataset.meta || '');
    currentIdx = idx;
    renderLightbox();
    lightbox.classList.add('open');
  }
  function renderLightbox(){
    lbImg.src = currentGallery[currentIdx];
    lbCount.textContent = (currentIdx+1) + ' / ' + currentGallery.length;
    lbTitle.textContent = currentTitles[currentIdx] || '';
    lbMeta.textContent = currentMetas[currentIdx] || '';
    lbPhotoCaption.textContent = currentCaptions[currentIdx] || '';
    lbPhotoCaption.style.display = currentCaptions[currentIdx] ? '' : 'none';
    const note = currentNotes[currentIdx] || '';
    // notes may carry hand-authored inline SVG (e.g. 웅이's scattered title)
    lbNote.innerHTML = note;
    lbNote.style.display = note ? '' : 'none';
    lightbox.scrollTop = 0;
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function nextImg(){ currentIdx = (currentIdx+1) % currentGallery.length; renderLightbox(); }
  function prevImg(){ currentIdx = (currentIdx-1+currentGallery.length) % currentGallery.length; renderLightbox(); }

  document.addEventListener('click', (e) => {
    const img = e.target.closest('.thumb-grid img');
    if (img){
      openLightbox(img.dataset.gallery, parseInt(img.dataset.idx,10));
    }
  });
  document.querySelector('.lb-close').addEventListener('click', closeLightbox);
  document.querySelector('.lb-next').addEventListener('click', nextImg);
  document.querySelector('.lb-prev').addEventListener('click', prevImg);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextImg();
    if (e.key === 'ArrowLeft') prevImg();
  });
})();
</script>
</body>
</html>
